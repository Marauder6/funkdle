name: Deploy

# Builds and publishes the site to GitHub Pages on every push to main (SPEC 11, Phase 5).
# The repo's Pages source must be "GitHub Actions" (enabled 2026-11-05).

on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-wide rights: each job gets only what it needs. The build job runs ~200 npm
# packages, so it must not hold the Pages or OIDC rights the deploy job uses.
permissions: {}

# One deployment at a time; a newer push waits rather than cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs (tag in the comment): a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Never publish a build that fails the checks.
      - run: npm run check
      - run: npm run build
      # No configure-pages step: it only reports the site's base URL, which vite.config.ts fixes,
      # and it would need Pages API access in this job.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
